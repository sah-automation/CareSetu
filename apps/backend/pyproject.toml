[project]
name = "caresetu-backend"
version = "0.1.0"
description = "CareSetu modular-monolith backend (FastAPI, async SQLAlchemy 2.0)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "httpx>=0.27",
    "mypy>=1.11",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests/unit", "tests/integration"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["apps/backend"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.bandit]
exclude_dirs = ["tests", "alembic"]
skips = []
