# CareSetu Render Blueprint (DEPLOY-5, ticket #115).
#
# One web service for the backend. The async event dispatcher (outbox poll
# loop, intake pipeline, credential-expiry sweep) runs IN-PROCESS in the web
# service's FastAPI lifespan instead of a separate Render worker: Render free
# compute covers web services only (background workers need a paid instance),
# and with DISPATCHER_IN_PROCESS_ENABLED=true the web service runs exactly one
# poll loop at uvicorn --workers 1 (the single-worker rule, worker-outbox
# runbook Rule 1). Source of truth for the commands and env vars is plan
# section 5.2 (docs/plans/deployment-plan/portfolio-deployment-plan.md);
# provisioning and live verification are DEPLOY-7 (ticket #117).

services:
  - type: web
    name: caresetu-backend
    # The deploy hook fired by deploy.yml is the sole automated deploy
    # trigger, so this stays false: a git "On Commit" auto-deploy would boot
    # before deploy.yml's migrate-and-seed and redeploy on docs-only pushes.
    autoDeploy: false
    runtime: python
    plan: free
    branch: main
    rootDir: apps/backend
    buildCommand: uv sync --frozen --no-dev
    # uv run self-discovers the .venv that the build created; Render's start
    # shell does NOT put that venv's bin/ on PATH, so bare alembic/uvicorn
    # would fail with "command not found" (seen live in DEPLOY-7).
    #
    # No boot-time `alembic upgrade head`: deploy.yml migrates the database
    # and only then fires the deploy hook, and Render auto-deploy is OFF
    # (`autoDeploy: false`, dashboard confirmed 2026-08-16), so the hook (or a
    # manual dashboard deploy) is the sole trigger. Running migrations here too
    # would only add seconds to every cold start for zero benefit. A
    # fresh-from-scratch blueprint provision relies on the next push to main to
    # migrate before first boot.
    startCommand: uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      # Render Python runtime selects the interpreter from PYTHON_VERSION.
      - key: PYTHON_VERSION
        value: "3.13"
      # Supabase direct connection string; set in the Render Dashboard during
      # blueprint creation (DEPLOY-7), never synced from the repo.
      - key: DATABASE_URL
        sync: false
      - key: APP_ENVIRONMENT
        value: production
      # JWT verification and gateway rate limiting are on for the demo.
      - key: GATEWAY_JWT_VERIFY_ENABLED
        value: "true"
      # Render generates a random 256-bit signing key at provisioning; the
      # value is retained across blueprint syncs and never committed to the
      # repo.
      - key: GATEWAY_JWT_SIGNING_KEY
        generateValue: true
      - key: GATEWAY_RATE_LIMIT_ENABLED
        value: "true"
      # Demo mode reads the OTP back into the UI, so SMS stays mocked.
      - key: SMS_PROVIDER
        value: mock
      - key: DEMO_MODE
        value: "true"
      # Vercel frontend origin; set in the Render Dashboard during blueprint
      # creation (DEPLOY-7).
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # Operator MFA TOTP secret encryption (PHASE-5 S8, #261): the AES key the
      # seed's bootstrap-operator MFA enrollment writes into Supabase. MUST equal
      # the GitHub Actions secret IAM_MFA_SECRET_KEY used by the migrate-and-seed
      # job so the runtime can decrypt that TOTP secret. Set in the Render
      # Dashboard during blueprint creation (DEPLOY-7), never synced from the repo.
      - key: IAM_MFA_SECRET_KEY
        sync: false
      # Langfuse AI observability (plan-phase7-tracing-prep): SDK keys for LLM
      # call tracing, consumed by the AI gateway port from Phase 7 onward. Set
      # in the Render Dashboard during Langfuse account setup, never synced from
      # the repo. Both must be set together or left absent (absent = disabled).
      - key: LANGFUSE_PUBLIC_KEY
        sync: false
      - key: LANGFUSE_SECRET_KEY
        sync: false
      - key: LANGFUSE_HOST
        value: https://us.cloud.langfuse.com
      # Observability gates (PHASE-14A A5, #693; plan-phase14 §4): every gate
      # is additive and disabled by default, so nothing here changes current
      # boot behaviour until the consuming ticket (A1/A3/A4, MOD-013) lands.
      # LOG_FORMAT=json is the production structured-log intent (A1); Sentry,
      # OTel endpoints and headers are secrets set in the Render Dashboard
      # during provisioning, never synced from the repo. OTEL_SERVICE_VERSION
      # is the git SHA release tag (shared by A3/A4) - dashboard-managed.
      - key: LOG_FORMAT
        value: json
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "0.0"
      - key: OTEL_ENABLED
        value: "false"
      - key: OTEL_EXPORTER_OTLP_ENDPOINT
        sync: false
      - key: OTEL_EXPORTER_OTLP_HEADERS
        sync: false
      - key: OTEL_TRACES_SAMPLER_RATIO
        value: "1.0"
      - key: OTEL_SERVICE_VERSION
        sync: false
      - key: METRICS_ENABLED
        value: "false"
      - key: OBSERVABILITY_ENABLED
        value: "false"
      # Batch-3 observability feature gates (#753): additive and disabled by
      # default, one gate per shipped feature. Flip a gate on in the Render
      # Dashboard to opt this deployment into the feature it names - with every
      # gate at "false" each feature is a complete no-op, as before it existed.
      # EVALUATION_ENABLED is consumed by the nightly observability-rollup
      # workflow (which opts its own step in); it is declared here so every
      # gate's default lives in one manifest.
      - key: ERROR_CAPTURE_ENABLED
        value: "false"
      - key: HTTP_COUNTER_ENABLED
        value: "false"
      - key: EVALUATION_ENABLED
        value: "false"
      - key: ANNOTATION_QUEUE_ENABLED
        value: "false"
      # MOD-013's alert thresholds (Batch 3, #717; plan-phase14 §11): the limits
      # the nightly rollup compares against. Each is configuration rather than a
      # constant in the rule that reads it (coding-standards §9.1), so a
      # deployment moves a threshold here and never in code. The four thresholds
      # NOT declared here are the ones a decision record pins (ADR-0027 D8,
      # ADR-0030 D1 and D3): a promised objective is not a knob.
      - key: OBSERVABILITY_BUDGET_ALERT_THRESHOLD_PCT
        value: "80"
      - key: OBSERVABILITY_BREAKER_OPEN_SUCCESS_RATE
        value: "0.5"
      - key: OBSERVABILITY_PROVIDER_HEALTH_DROP_THRESHOLD
        value: "0.2"
      - key: OBSERVABILITY_OUTBOX_BACKLOG_THRESHOLD
        value: "500"
      - key: OBSERVABILITY_QUEUE_AGE_THRESHOLD_SECONDS
        value: "900"
      - key: OBSERVABILITY_COST_OUTLIER_MULTIPLE
        value: "3"
      - key: OBSERVABILITY_COST_OUTLIER_MIN_BASELINE_DAYS
        value: "3"
      - key: OBSERVABILITY_PROVIDER_RATE_LIMIT_ALERT_COUNT
        value: "1"
      # Browsable Grafana base (PHASE-14A C1b, #707): the stack the OTLP endpoint
      # above exports into, as an operator can actually open it. Serves the
      # operator observability "/deeplinks" read; dashboard-managed, because the
      # stack URL is per-environment and carries no credential.
      - key: GRAFANA_URL
        sync: false
      # Durable intake-media backend (PHASE-7 fix #385): the production backend
      # is a private Supabase Storage bucket so voice captures survive Render's
      # ephemeral disk (wiped on redeploy). SUPABASE_URL and
      # SUPABASE_SERVICE_ROLE_KEY are set in the Render Dashboard during
      # provisioning (DEPLOY-7) like DATABASE_URL, never synced from the repo.
      - key: INTAKE_MEDIA_BACKEND
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Durable profile-media backing (#555, ADR-0020): profile photos follow the
      # same rule as voice captures, in their own private bucket. The store
      # defaults to local disk, so without this an upload lands on Render's
      # ephemeral disk and is wiped on the next redeploy while the profile row
      # still claims a photo exists. Service-role writes only, no public-read
      # policy: the bucket is private and every read streams through the backend.
      - key: PROFILE_MEDIA_BACKEND
        value: supabase
      # Media encryption keys (#555): with no key configured each store derives an
      # ephemeral per-process AES-256 key, so every restart mints a new one and
      # all previously stored ciphertext becomes permanently undecryptable -
      # silently. Both are base64-encoded 32-byte values generated and set in the
      # Render Dashboard (DEPLOY-7), never synced from the repo. They are declared
      # together because the two stores drift independently: intake audio already
      # used the durable bucket but could not be decrypted back after a restart.
      - key: INTAKE_MEDIA_KEY
        sync: false
      - key: PROFILE_MEDIA_KEY
        sync: false
      # AI provider gateway (T04, #381; T14, #414): the demo now rides a real
      # OpenAI-compatible provider instead of mock canned pre-summaries.
      # AI_PROVIDER and AI_ALLOW_DEMO_PROVIDER are blueprint-managed toggles so
      # a blueprint sync cannot silently flip production back to mock (seen
      # live on the demo site). The provider model/base URL and both API keys
      # are set in the Render Dashboard like DATABASE_URL - never committed.
      # AI_ALLOW_DEMO_PROVIDER=true is the explicit opt-in (T14, #414) that lets
      # the real EXT-002 provider run under DEMO_MODE=true (fail-closed default
      # is off); it is ignored when DEMO_MODE is false.
      - key: AI_PROVIDER
        value: openai_compatible
      - key: AI_ALLOW_DEMO_PROVIDER
        value: "true"
      - key: AI_API_KEY
        sync: false
      - key: AI_BASE_URL
        sync: false
      - key: AI_MODEL
        sync: false
      # ASR model for the /audio/transcriptions leg (#387) - dashboard-managed.
      - key: AI_ASR_MODEL
        sync: false
      # Per-model AI pricing (B1, #699): "model:price_in:price_out" paise-per-token
      # rates the meter prices completed AI calls off. Dashboard-managed: the
      # production serving model MUST carry an entry or it prices 0 and is logged
      # as unknown. Default (unset) keeps the free mock as a known-free model.
      - key: AI_PRICING_TABLE
        sync: false
      # Fallback provider chain (all-or-none, T04 #381): dashboard-managed.
      - key: AI_FALLBACK_PROVIDER
        sync: false
      - key: AI_FALLBACK_BASE_URL
        sync: false
      - key: AI_FALLBACK_API_KEY
        sync: false
      - key: AI_FALLBACK_MODEL
        sync: false
      # In-process dispatcher (worker-outbox-runbook Rule 1): the outbox poll
      # loop, intake structuring pipeline, and credential-expiry sweep all run
      # inside this web service's FastAPI lifespan rather than a separate Render
      # worker (free compute covers web services only). Requires
      # uvicorn --workers 1; the startCommand above satisfies that constraint.
      - key: DISPATCHER_IN_PROCESS_ENABLED
        value: "true"
