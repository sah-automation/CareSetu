# CareSetu Render Blueprint (DEPLOY-5, ticket #115).
#
# One web service for the backend. The async event dispatcher (outbox poll
# loop, intake pipeline, credential-expiry sweep) runs IN-PROCESS in the web
# service's FastAPI lifespan instead of a separate Render worker: Render free
# compute covers web services only (background workers need a paid instance),
# and with DISPATCHER_IN_PROCESS_ENABLED=true the web service runs exactly one
# poll loop at uvicorn --workers 1 (the single-worker rule, worker-outbox
# runbook Rule 1). Source of truth for the commands and env vars is plan
# section 5.2 (docs/plans/deployment-plan/portfolio-deployment-plan.md);
# provisioning and live verification are DEPLOY-7 (ticket #117).

services:
  - type: web
    name: caresetu-backend
    # The deploy hook fired by deploy.yml is the sole automated deploy
    # trigger, so this stays false: a git "On Commit" auto-deploy would boot
    # before deploy.yml's migrate-and-seed and redeploy on docs-only pushes.
    autoDeploy: false
    runtime: python
    plan: free
    branch: main
    rootDir: apps/backend
    buildCommand: uv sync --frozen --no-dev
    # uv run self-discovers the .venv that the build created; Render's start
    # shell does NOT put that venv's bin/ on PATH, so bare alembic/uvicorn
    # would fail with "command not found" (seen live in DEPLOY-7).
    #
    # No boot-time `alembic upgrade head`: deploy.yml migrates the database
    # and only then fires the deploy hook, and Render auto-deploy is OFF
    # (`autoDeploy: false`, dashboard confirmed 2026-08-16), so the hook (or a
    # manual dashboard deploy) is the sole trigger. Running migrations here too
    # would only add seconds to every cold start for zero benefit. A
    # fresh-from-scratch blueprint provision relies on the next push to main to
    # migrate before first boot.
    startCommand: uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      # Render Python runtime selects the interpreter from PYTHON_VERSION.
      - key: PYTHON_VERSION
        value: "3.13"
      # Supabase direct connection string; set in the Render Dashboard during
      # blueprint creation (DEPLOY-7), never synced from the repo.
      - key: DATABASE_URL
        sync: false
      - key: APP_ENVIRONMENT
        value: production
      # JWT verification and gateway rate limiting are on for the demo.
      - key: GATEWAY_JWT_VERIFY_ENABLED
        value: "true"
      # Render generates a random 256-bit signing key at provisioning; the
      # value is retained across blueprint syncs and never committed to the
      # repo.
      - key: GATEWAY_JWT_SIGNING_KEY
        generateValue: true
      - key: GATEWAY_RATE_LIMIT_ENABLED
        value: "true"
      # Demo mode reads the OTP back into the UI, so SMS stays mocked.
      - key: SMS_PROVIDER
        value: mock
      - key: DEMO_MODE
        value: "true"
      # Vercel frontend origin; set in the Render Dashboard during blueprint
      # creation (DEPLOY-7).
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # Operator MFA TOTP secret encryption (PHASE-5 S8, #261): the AES key the
      # seed's bootstrap-operator MFA enrollment writes into Supabase. MUST equal
      # the GitHub Actions secret IAM_MFA_SECRET_KEY used by the migrate-and-seed
      # job so the runtime can decrypt that TOTP secret. Set in the Render
      # Dashboard during blueprint creation (DEPLOY-7), never synced from the repo.
      - key: IAM_MFA_SECRET_KEY
        sync: false
      # Langfuse AI observability (plan-phase7-tracing-prep): SDK keys for LLM
      # call tracing, consumed by the AI gateway port from Phase 7 onward. Set
      # in the Render Dashboard during Langfuse account setup, never synced from
      # the repo. Both must be set together or left absent (absent = disabled).
      - key: LANGFUSE_PUBLIC_KEY
        sync: false
      - key: LANGFUSE_SECRET_KEY
        sync: false
      - key: LANGFUSE_HOST
        value: https://us.cloud.langfuse.com
      # Durable intake-media backend (PHASE-7 fix #385): the production backend
      # is a private Supabase Storage bucket so voice captures survive Render's
      # ephemeral disk (wiped on redeploy). SUPABASE_URL and
      # SUPABASE_SERVICE_ROLE_KEY are set in the Render Dashboard during
      # provisioning (DEPLOY-7) like DATABASE_URL, never synced from the repo.
      - key: INTAKE_MEDIA_BACKEND
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # AI provider gateway (T04, #381): demo stays on mock (fail-closed) via
      # DEMO_MODE=true.  To point at a real OpenAI-compatible provider, set
      # AI_PROVIDER, AI_MODEL, AI_API_KEY, AI_BASE_URL, and optionally the
      # all-or-none fallback set (AI_FALLBACK_*).  See .env.example for a
      # quick-switch table (Groq, Gemini, OpenRouter, OpenAI).
      - key: AI_PROVIDER
        value: mock
      # In-process dispatcher (worker-outbox-runbook Rule 1): the outbox poll
      # loop, intake structuring pipeline, and credential-expiry sweep all run
      # inside this web service's FastAPI lifespan rather than a separate Render
      # worker (free compute covers web services only). Requires
      # uvicorn --workers 1; the startCommand above satisfies that constraint.
      - key: DISPATCHER_IN_PROCESS_ENABLED
        value: "true"
