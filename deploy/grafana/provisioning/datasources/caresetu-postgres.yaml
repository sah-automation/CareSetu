apiVersion: 1
datasources:
  - name: CareSetu Observability (Postgres)
    uid: caresetu-observability-postgres
    type: postgres
    access: proxy
    url: "${CARESETU_DB_HOST}:${CARESETU_DB_PORT}"
    database: "${CARESETU_DB_NAME}"
    user: "${CARESETU_DB_READONLY_USER}"
    secureJsonData:
      password: "${CARESETU_DB_READONLY_PASSWORD}"
    jsonData:
      sslmode: require
      postgresVersion: 1600
    editable: false
