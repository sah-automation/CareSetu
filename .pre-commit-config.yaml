repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=1024]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff
        args: [--fix, --config, apps/backend/pyproject.toml]
      - id: ruff-format
        args: [--config, apps/backend/pyproject.toml]

  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: [-c, apps/backend/pyproject.toml, -r, apps/backend]

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        files: \.(js|jsx|ts|tsx|json|css|md)$
        args: [--write]

  - repo: local
    hooks:
      - id: check-module-boundaries
        name: module boundary checker (ADR-0003)
        entry: python apps/backend/scripts/check_module_boundaries.py
        language: python
        additional_dependencies: []
        pass_filenames: false
        always_run: true
      - id: check-migrations-fk
        name: migration cross-schema FK checker (ADR-0003)
        entry: python apps/backend/scripts/check_migrations_fk.py
        language: python
        additional_dependencies: []
        pass_filenames: false
        always_run: true
      - id: check-edge-config
        name: edge reverse-proxy config lint (PHASE-1 T8a #31)
        entry: python apps/backend/scripts/check_edge_config.py
        language: python
        additional_dependencies: []
        pass_filenames: false
        always_run: true
      - id: check-backup-config
        name: daily backup scaffold lint (PHASE-1 T8b #32)
        entry: python apps/backend/scripts/check_backup_config.py
        language: python
        additional_dependencies: []
        pass_filenames: false
        always_run: true
