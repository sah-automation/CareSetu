name: Setup k6
description: Cache and install k6 v2.2.0 binary
runs:
  using: composite
  steps:
    - name: cache k6 binary
      id: k6-cache
      uses: actions/cache@v4
      with:
        path: /usr/local/bin/k6
        key: k6-v2.2.0-linux
    - name: install k6
      if: steps.k6-cache.outputs.cache-hit != 'true'
      run: |
        curl --fail -sSL https://github.com/grafana/k6/releases/download/v2.2.0/k6-v2.2.0-linux-amd64.tar.gz -o k6.tar.gz
        tar -xzf k6.tar.gz
        sudo install -m 0755 k6-v2.2.0-linux-amd64/k6 /usr/local/bin/k6
      shell: bash
    - name: verify k6
      run: k6 version
      shell: bash
