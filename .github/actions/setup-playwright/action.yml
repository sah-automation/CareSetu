name: Setup Playwright
description: Cache and install Playwright browser + system deps with timeout guard
inputs:
  install-deps:
    description: Whether to install system deps (set to "false" if already cached)
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - name: cache Playwright browsers
      id: playwright-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
    - name: install Playwright chromium + system deps
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: npx playwright install --with-deps chromium
      shell: bash
      timeout-minutes: 5
    - name: install Playwright system deps only
      if: steps.playwright-cache.outputs.cache-hit == 'true' && inputs.install-deps == 'true'
      run: npx playwright install-deps chromium
      shell: bash
      timeout-minutes: 3
    - name: verify Playwright chromium
      run: npx playwright install --dry-run chromium
      shell: bash
