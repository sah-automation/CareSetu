name: Deploy

# Continuous deployment (DEPLOY-6, ticket #116). Runs on every push to main
# and on manual dispatch. Vercel deploys the frontend from the same push by
# itself, so this workflow only manages the parts that are not self-deploying:
# the Supabase schema (migrate + seed) and the Render backend (deploy hook).
#
# Ordering tolerance: Vercel's frontend build may briefly race this workflow's
# migration. The app tolerates it - registration against a not-yet-migrated
# database returns a 500 envelope the UI shows as an error, and the user
# retries once the migration lands (plan section 6.1).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # One in-flight deploy per branch; a newer run cancels an older one from
  # the same branch (plan section 6.1).
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: CI gate (reusable ci.yml)
    # CD only proceeds on green CI: ci.yml runs every job (lint, typecheck,
    # unit, page-budget, migration-check, integration, backup-smoke, e2e, scan)
    # as one reusable gate before migrate-and-seed starts. The called workflow
    # is auto-granted secrets.GITHUB_TOKEN, so the scan job runs the same here
    # as it does standalone.
    uses: ./.github/workflows/ci.yml

  migrate-and-seed:
    name: migrate + seed (Supabase)
    needs: gate
    runs-on: ubuntu-latest
    env:
      # Both secrets are created during DEPLOY-7 provisioning. A missing secret
      # fails the run loudly at the first assert step, before migrations or the
      # seed touch the database - never a silent fallback to the localhost
      # defaults in alembic.ini / app config.
      DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: install backend
        run: uv sync --project apps/backend
      - name: assert SUPABASE_DATABASE_URL is set
        run: test -n "$DATABASE_URL"
      - name: assert RENDER_DEPLOY_HOOK_URL is set
        run: test -n "$RENDER_DEPLOY_HOOK_URL"
      - name: alembic upgrade head
        run: uv run --project apps/backend alembic -c apps/backend/alembic.ini upgrade head
      - name: seed demo data
        # The plan's repo-root spelling (`uv run --project apps/backend python
        # -m scripts.seed_demo`) cannot import the `scripts` package; ticket
        # #114 runs the seed from `apps/backend`, so this step uses that cwd
        # and lets uv auto-detect the project there. Do not revert to root.
        working-directory: apps/backend
        run: uv run python -m scripts.seed_demo

  deploy-render:
    name: trigger Render deploy
    needs: migrate-and-seed
    runs-on: ubuntu-latest
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
    steps:
      # --fail makes a non-2xx hook response fail the job instead of passing
      # silently.
      - name: fire Render deploy hook
        run: curl --fail -X POST "$RENDER_DEPLOY_HOOK_URL"

  live-load-sweep:
    name: A2 live load sweep (k6, /health + /v1/me)
    # TEST-A2 (#134): the first live job. Runs the tolerant production-stack
    # health sweep right after the Render deploy hook is fired - the sweep's
    # warm-up poll absorbs the hook-triggered build plus Render's cold start
    # (plan §2, §3.A2). Reads the LIVE_BACKEND_URL / LIVE_FRONTEND_URL repo
    # variables this job owns; TEST-B2 (#136) and TEST-D (#137) reuse them.
    needs: deploy-render
    runs-on: ubuntu-latest
    env:
      LIVE_BACKEND_URL: ${{ vars.LIVE_BACKEND_URL }}
      LIVE_FRONTEND_URL: ${{ vars.LIVE_FRONTEND_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: assert LIVE_BACKEND_URL / LIVE_FRONTEND_URL are set
        run: |
          test -n "$LIVE_BACKEND_URL"
          test -n "$LIVE_FRONTEND_URL"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: install k6 (explicit, like the ci.yml load-test job)
        run: |
          curl --fail -sSL https://github.com/grafana/k6/releases/download/v2.2.0/k6-v2.2.0-linux-amd64.tar.gz -o k6.tar.gz
          tar -xzf k6.tar.gz
          sudo install -m 0755 k6-v2.2.0-linux-amd64/k6 /usr/local/bin/k6
          k6 version
      - name: warm up + mint live session token
        # Mint the shared session token from the live register -> dev/otp ->
        # verify -> session flow on a dedicated test phone (never the seeded
        # demo phone +91 9000000001, so this job never races TEST-D on the 60 s
        # per-phone resend cooldown). The warm-up request in the script absorbs
        # the Render cold start before any metric is recorded.
        id: mint
        run: echo "token=$(node scripts/loadtest/mint-live-token.cjs)" >> "$GITHUB_OUTPUT"
        env:
          LIVE_BACKEND_URL: ${{ vars.LIVE_BACKEND_URL }}
          TEST_PHONE: "9000000002"
      - name: run live load sweep
        # 20 VUs for 90 s against /health + /v1/me only - the per-IP auth
        # limiter makes the auth surface meaningless under load (plan §2).
        # Thresholds are tolerant health-sweep bounds, not SLAs: error rate
        # < 2%, p95 < 2.5 s (plan §3.A2).
        run: k6 run --summary-export=k6-summary.json scripts/loadtest/live-sweep.js -e BASE_URL="$LIVE_BACKEND_URL" -e TOKEN="$LIVE_SWEEP_TOKEN"
        env:
          LIVE_SWEEP_TOKEN: ${{ steps.mint.outputs.token }}
      - name: upload k6 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-live-load-report
          path: k6-summary.json
