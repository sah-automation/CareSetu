name: Deploy

# Continuous deployment (DEPLOY-6, ticket #116). Runs on every push to main
# and on manual dispatch. Vercel deploys the frontend from the same push by
# itself (its Ignored Build Step skips the build when only non-frontend files
# changed), and Render auto-deploy is OFF, so this workflow manages everything
# else: the Supabase schema (migrate + seed) and the Render backend (deploy
# hook - the sole automated deploy trigger now).
#
# Ordering tolerance: Vercel's frontend build may briefly race this workflow's
# migration. The app tolerates it - registration against a not-yet-migrated
# database returns a 500 envelope the UI shows as an error, and the user
# retries once the migration lands (plan section 6.1).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # One in-flight deploy per branch; a newer run queues behind an older one
  # instead of cancelling it (plan section 6.1).
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  gate:
    name: CI gate (reusable ci.yml)
    # CD only proceeds on green CI: ci.yml runs every job (lint, typecheck,
    # unit, page-budget, migration-check, integration, backup-smoke, e2e, scan)
    # as one reusable gate before migrate-and-seed starts. The called workflow
    # is auto-granted secrets.GITHUB_TOKEN, so the scan job runs the same here
    # as it does standalone.
    uses: ./.github/workflows/ci.yml

  migrate-and-seed:
    name: migrate + seed (Supabase)
    needs: gate
    runs-on: ubuntu-latest
    env:
      # These secrets are created during DEPLOY-7 provisioning. A missing secret
      # fails the run loudly at the first assert step, before migrations or the
      # seed touch the database - never a silent fallback to the localhost
      # defaults in alembic.ini / app config.
      DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
      # Operator MFA TOTP secret encryption (PHASE-5 S8, #261): the seed's
      # bootstrap-operator MFA enrollment (scripts/seed_demo.py) needs the AES
      # key the MFA module reads as IAM_MFA_SECRET_KEY. Must match the Cloud Run
      # service env var of the same name so the encrypted TOTP secret seeded
      # here can be decrypted at runtime (security-phii-standards section 4).
      IAM_MFA_SECRET_KEY: ${{ secrets.IAM_MFA_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: install backend
        run: uv sync --project apps/backend
      - name: assert SUPABASE_DATABASE_URL is set
        run: test -n "$DATABASE_URL"
      - name: assert IAM_MFA_SECRET_KEY is set
        run: test -n "$IAM_MFA_SECRET_KEY"
      - name: alembic upgrade head
        run: uv run --project apps/backend alembic -c apps/backend/alembic.ini upgrade head
      - name: seed demo data
        # The plan's repo-root spelling (`uv run --project apps/backend python
        # -m scripts.seed_demo`) cannot import the `scripts` package; ticket
        # #114 runs the seed from `apps/backend`, so this step uses that cwd
        # and lets uv auto-detect the project there. Do not revert to root.
        working-directory: apps/backend
        run: uv run python -m scripts.seed_demo

  deploy-cloudrun:
    name: deploy backend to Cloud Run (asia-south1 / Mumbai)
    needs: migrate-and-seed
    runs-on: ubuntu-latest
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: asia-south1
      CLOUD_RUN_SERVICE: caresetu-backend
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/setup-gcloud@v2
        with:
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
      - name: Build and deploy backend to Cloud Run
        run: |
          gcloud run deploy caresetu-backend \
            --source apps/backend \
            --region asia-south1 \
            --allow-unauthenticated \
            --max-instances=1 \
            --min-instances=0 \
            --memory 512Mi \
            --cpu 1 \
            --set-env-vars "PYTHON_VERSION=3.13,APP_ENVIRONMENT=production,DISPATCHER_IN_PROCESS_ENABLED=true,DISPATCHER_MODE=inprocess,UVICORN_WORKERS=1,AI_ASYNC_ENABLED=false,AI_QUEUE_WORKER_ENABLED=false,DEMO_MODE=true,SMS_PROVIDER=mock,GATEWAY_JWT_VERIFY_ENABLED=true,GATEWAY_RATE_LIMIT_ENABLED=true,GATEWAY_ACCESS_TOKEN_TTL_SECONDS=7200,LOG_FORMAT=json,SENTRY_TRACES_SAMPLE_RATE=1.0,OTEL_ENABLED=false,OTEL_TRACES_SAMPLER_RATIO=1.0,METRICS_ENABLED=true,OBSERVABILITY_ENABLED=true,ERROR_CAPTURE_ENABLED=true,HTTP_COUNTER_ENABLED=true,EVALUATION_ENABLED=false,ANNOTATION_QUEUE_ENABLED=false,OBSERVABILITY_BUDGET_ALERT_THRESHOLD_PCT=80,OBSERVABILITY_BREAKER_OPEN_SUCCESS_RATE=0.5,OBSERVABILITY_PROVIDER_HEALTH_DROP_THRESHOLD=0.2,OBSERVABILITY_OUTBOX_BACKLOG_THRESHOLD=500,OBSERVABILITY_QUEUE_AGE_THRESHOLD_SECONDS=900,OBSERVABILITY_COST_OUTLIER_MULTIPLE=3,OBSERVABILITY_COST_OUTLIER_MIN_BASELINE_DAYS=3,OBSERVABILITY_PROVIDER_RATE_LIMIT_ALERT_COUNT=1,INTAKE_MEDIA_BACKEND=supabase,PROFILE_MEDIA_BACKEND=supabase,AI_PROVIDER=openai_compatible,AI_ALLOW_DEMO_PROVIDER=true,AI_CIRCUIT_BREAKER_COOLDOWN_SECONDS=30.0,AI_CIRCUIT_BREAKER_THRESHOLD=5,AI_MAX_RETRIES=3,AI_TIMEOUT_SECONDS=30.0,ERROR_CAPTURE_MAX_RECORDS=1000,ERROR_DRAIN_INTERVAL_SECONDS=30,HTTP_COUNTER_MAX_SERIES=5000,SUPABASE_BUCKET=none,LANGFUSE_HOST=https://us.cloud.langfuse.com,AI_WEBHOOK_TIMEOUT_SECONDS=10.0,AI_WEBHOOK_MAX_ATTEMPTS=3" \
            --set-secrets "DATABASE_URL=DATABASE_URL:latest,CORS_ALLOWED_ORIGINS=CORS_ALLOWED_ORIGINS:latest,GATEWAY_JWT_SIGNING_KEY=GATEWAY_JWT_SIGNING_KEY:latest,IAM_MFA_SECRET_KEY=IAM_MFA_SECRET_KEY:latest,LANGFUSE_PUBLIC_KEY=LANGFUSE_PUBLIC_KEY:latest,LANGFUSE_SECRET_KEY=LANGFUSE_SECRET_KEY:latest,SENTRY_DSN=SENTRY_DSN:latest,OTEL_EXPORTER_OTLP_ENDPOINT=OTEL_EXPORTER_OTLP_ENDPOINT:latest,OTEL_EXPORTER_OTLP_HEADERS=OTEL_EXPORTER_OTLP_HEADERS:latest,GRAFANA_URL=GRAFANA_URL:latest,SUPABASE_URL=SUPABASE_URL:latest,SUPABASE_SERVICE_ROLE_KEY=SUPABASE_SERVICE_ROLE_KEY:latest,INTAKE_MEDIA_KEY=INTAKE_MEDIA_KEY:latest,PROFILE_MEDIA_KEY=PROFILE_MEDIA_KEY:latest,AI_API_KEY=AI_API_KEY:latest,AI_BASE_URL=AI_BASE_URL:latest,AI_MODEL=AI_MODEL:latest,AI_ASR_MODEL=AI_ASR_MODEL:latest"

  live-verify:
    name: live verify (reusable)
    # TEST-A2 (#134), TEST-B2 (#136), TEST-D (#137): the three live verification
    # jobs extracted into a reusable workflow. Runs after the Cloud Run deploy;
    # each job's own warm-up / retry window absorbs the build + cold start
    # (plan §2, §3.A2/B2/D).
    needs: deploy-cloudrun
    uses: ./.github/workflows/live-verify.yml
    secrets: inherit
